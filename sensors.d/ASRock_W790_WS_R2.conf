# ASRock
# W790 WS R2.0
# Nuvoton NCT6686D ISA A20h
#
# Fan labels are the board's header names. The mapping was worked out by
# comparing RPM readings with the UEFI H/W Monitor, not from a schematic.
# CPU_FAN1 read 0 RPM on the test machine because its fans send no tach signal.

chip "nct6686-*"
    label fan1        "CPU_FAN1"
    label fan2        "CHA_FAN1"
    label fan3        "CPU_FAN2/W_PUMP"
    label fan4        "CHA_FAN3"
